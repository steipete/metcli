name: Release (unified)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign and verify without creating tags or releases
        type: boolean
        default: true
      version:
        description: SemVer to release
        required: true
        type: string

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check frozen release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION#v}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$DRY_RUN" != true ]] && git show-ref --verify --quiet "refs/tags/$tag"; then
            git checkout --detach "refs/tags/$tag"
          fi
          python3 scripts/release-notes.py "$tag"

  release:
    needs: preflight
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-go-cli.yml@fc49859568b3781af7663bee48c003fd987dc08b # v1.11.8
    with:
      dry-run: ${{ inputs.dry_run }}
      version: ${{ inputs.version }}
      repository-type: personal
      build-runner: macos
      checksum-filename: checksums.txt
      archive-files: '["CHANGELOG.md", "LICENSE", "README.md"]'
      darwin-universal: disabled
      strict-checks: true
      ci-check-events: '["push", "pull_request"]'
    secrets:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY }}
