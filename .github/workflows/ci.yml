name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25.0', '1.27.2']
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt check
        run: test -z "$(gofmt -l .)"

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go test
        run: go test ./...

      - name: Build and smoke test CLIs
        run: |
          go build -o "$RUNNER_TEMP/metcli-bin/" ./cmd/...
          python3 scripts/smoke.py "$RUNNER_TEMP/metcli-bin"

      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check

  macos-release:
    name: macOS release targets
    runs-on: xcode-27
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
      - name: Test deployment-target guard
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build release matrix and verify macOS minimum
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: build --snapshot --clean --parallelism=2
      - name: Smoke-test both macOS architectures
        run: |
          arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true
          for target in amd64 arm64; do
            for name in metcli ig-cookies ig-profile; do
              for binary in dist/"${name}"_darwin_"${target}"*/"$name"; do
                test -x "$binary"
                if [ "$target" = amd64 ]; then
                  arch -x86_64 "$binary" --version
                else
                  "$binary" --version
                fi
              done
            done
          done
