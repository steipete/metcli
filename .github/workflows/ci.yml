name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25.0', '1.25.14']
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt check
        run: test -z "$(gofmt -l .)"

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go test
        run: go test ./...

      - name: Build and smoke test CLIs
        run: |
          go build -o "$RUNNER_TEMP/metcli-bin/" ./cmd/...
          python3 scripts/smoke.py "$RUNNER_TEMP/metcli-bin"
