version: 2

project_name: metcli

release:
  name_template: "metcli {{ .Version }}"

changelog:
  disable: true

builds:
  - id: metcli
    main: ./cmd/metcli
    binary: metcli
    env: &release-env [CGO_ENABLED=0, MACOSX_DEPLOYMENT_TARGET=12.0]
    hooks: &release-hooks
      post:
        - cmd: 'python3 scripts/check_macos_target.py {{ .Os }} "{{ .Path }}"'
    targets: &targets
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: ig-cookies
    main: ./cmd/ig-cookies
    binary: ig-cookies
    env: *release-env
    hooks: *release-hooks
    targets: *targets
  - id: ig-profile
    main: ./cmd/ig-profile
    binary: ig-profile
    env: *release-env
    hooks: *release-hooks
    targets: *targets

archives:
  - ids: [metcli, ig-cookies, ig-profile]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
