version: 2

project_name: metcli

release:
  name_template: "metcli {{ .Version }}"

builds:
  - id: metcli
    main: ./cmd/metcli
    binary: metcli
    env: [CGO_ENABLED=0]
    targets: &targets
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: ig-cookies
    main: ./cmd/ig-cookies
    binary: ig-cookies
    env: [CGO_ENABLED=0]
    targets: *targets
  - id: ig-profile
    main: ./cmd/ig-profile
    binary: ig-profile
    env: [CGO_ENABLED=0]
    targets: *targets

archives:
  - ids: [metcli, ig-cookies, ig-profile]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
